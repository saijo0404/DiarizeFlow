[project]
name = "diarizeflow"
version = "1.0.0"
description = "Real-time AI Speaker Diarization & Translation HUD powered by NVIDIA Nemotron-3, Faster-Whisper, and SenseVoice"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "nemo-toolkit",
    "lhotse>=2.0.0a6",
    "onnx>=1.16.0",
    "onnxsim>=0.4.36",
    "onnxruntime>=1.19.0",
    "onnxconverter-common>=1.14.0",
    "onnxscript>=0.7.2",
    "soundfile>=0.12.0",
    "sounddevice>=0.5.6",
    "soundcard>=0.4.3",
    "faster-whisper>=1.0.0",
    "ml-dtypes>=0.4.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
    "websockets>=16.1.1",
    "pyyaml>=6.0.3",
    "aiohttp>=3.14.3",
    "pyside6>=6.11.2",
    "sentencepiece>=0.2.0",
    "kaldi-native-fbank>=1.20.0",
    "librosa>=0.10.0",
    "scipy>=1.12.0",
    "pydub>=0.25.0",
    "requests>=2.31.0",
]

[project.scripts]
diarizeflow-export = "diarizeflow.export_onnx:main"
diarizeflow-quantize = "diarizeflow.quantize:main"
diarizeflow-server = "diarizeflow.app.backend.server:run_cli"
diarizeflow-overlay = "diarizeflow.app.frontend.desktop_overlay:run_cli"
diarizeflow-app = "diarizeflow.app.launcher:run_cli"

[tool.uv.sources]
nemo-toolkit = { git = "https://github.com/NVIDIA-NeMo/Speech.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diarizeflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

